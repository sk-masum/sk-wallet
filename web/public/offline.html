<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | SK Wallet</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at 15% 8%, rgba(11, 95, 255, 0.12), transparent 35%),
          radial-gradient(circle at 85% 22%, rgba(11, 95, 255, 0.08), transparent 30%),
          linear-gradient(180deg, #ffffff, #f4f7ff);
        color: #0f172a;
      }
      .card {
        width: min(92vw, 420px);
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 50px -24px rgba(11, 95, 255, 0.45);
        padding: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        font-size: 0.95rem;
        opacity: 0.85;
      }
      .actions {
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #0b5fff;
        color: #fff;
        font-weight: 600;
        padding: 10px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>SK Wallet cannot reach the internet right now. Reconnect and try again.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
